# Render blueprint — the backend half of the Factor Prover deployment.
#
# Render reads this file from the repo root when you create a Blueprint, so the
# build and start commands live in version control instead of a web form where
# they can be neither reviewed nor reproduced.
#
# Three decisions here are load-bearing, and each would fail quietly rather than
# loudly if it were wrong.
#
# 1. `startCommand` changes directory before launching. That is not cosmetic.
#    src/session/loop.ts resolves its decision log as the RELATIVE path
#    `logs/decisions.jsonl`, so the process's working directory decides which
#    file a session appends to. Launching from the repo root would write to
#    `<repo>/logs/decisions.jsonl` while `GET /api/log/verify` advertises
#    `npm run verify-log --workspace apps/agent`, which verifies
#    `apps/agent/logs/decisions.jsonl`. The server and its own advertised
#    reproduction command would then be reading two different files — and the one
#    panel in the product whose whole job is letting a reader check the record
#    would be pointing somewhere else. `cd apps/agent` makes the two agree.
#
# 2. `--include=dev` on the install. `tsc` is a devDependency, so if Render sets
#    NODE_ENV=production the install would skip it and the build would fail on a
#    missing compiler. Asking for devDependencies explicitly makes the build
#    independent of that default.
#
# 3. NODE_VERSION is pinned to 24 because CI actually tests Node 24. Leaving it
#    unset would mean deploying an interpreter nothing has ever run the suite on.
#
# NOT set here, deliberately:
#
#   ADMIN_TOKEN — setting it requires an `x-admin-token` header on POST
#   /api/start, /api/stop and /api/reset, and the frontend never sends one. Set
#   it and the Pause/Resume/Reset buttons in the UI stop working. The server
#   itself logs a reminder to set it before leaving the loop unattended; for a
#   demo that someone is watching, leaving it open is the intended configuration.
#
#   GROQ_API_KEY — prompted for below but safe to leave blank. Without it the
#   loop falls back to the deterministic enumerator by design, so the agent still
#   runs end to end; the hypotheses are just less interesting.
#
# Note on storage: Render's free plan has no persistent disk, so decision-log
# entries written at runtime live only as long as the instance. The committed
# log is the durable artifact and a redeploy restores it. This is disclosed
# rather than hidden — a log that silently resets is exactly the kind of thing
# this project exists to not do.

services:
  - type: web
    name: factor-prover-agent
    runtime: node
    plan: free
    # Frankfurt is the closest of Render's regions to the builder, who is in
    # Nigeria. If Render rejects the region on this plan, `oregon` (the default)
    # is the drop-in alternative.
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install --no-audit --no-fund --include=dev && npm run build --workspace apps/agent
    startCommand: cd apps/agent && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"

      # The deployed frontend. `allowedOrigins()` in src/index.ts splits this on
      # commas and always appends localhost:3000 and 127.0.0.1:3000, so local
      # development against this backend keeps working and this value does not
      # need to name it.
      #
      # An explicit allowlist rather than a reflected origin: two of the control
      # routes change session state, so `origin: true` would let any website a
      # visitor opened stop the session.
      #
      # Committed as a literal rather than left `sync: false` so that the
      # allowlist is reviewable config in version control, like the build and
      # start commands above, instead of a value that exists only in a dashboard
      # and cannot be diffed. It is a public URL, not a secret, so there is
      # nothing here that belongs in the environment instead.
      - key: WEB_ORIGIN
        value: https://factorprover.vercel.app

      # Required by the preregistered checklist (build spec §17): the Execution
      # Guard's CHECK 1 demands exactly the string "true" and refuses every order
      # otherwise, and this deployment is supposed to be a paper-trading one.
      #
      # It was previously left unset, which meant production failed its own
      # checklist item while `docs/DEMO_SCRIPT.md` printed a tick beside it — the
      # homepage's trading banner named the missing variable, so the two
      # contradicted each other in public. Declared here rather than in the
      # dashboard for the same reason as WEB_ORIGIN: it is not a secret, and a
      # reviewer should be able to diff it.
      #
      # This does NOT authorise an order. `ENABLE_EXECUTION` is still unset and
      # the Bitget credentials are still absent, so CHECK 2 and CHECK 3 continue
      # to refuse — see the banner text in src/execution/agentHub.ts. Setting
      # this flag removes the one refusal that was a configuration oversight and
      # leaves the two that are deliberate.
      - key: BITGET_PAPER_TRADING
        value: "true"

      # Pacing, and without this the deployed service is quietly broken.
      #
      # The loop's built-in default is 1,500ms between hypotheses. That is fine
      # for the deterministic enumerator, which is a pure function and costs
      # nothing, but the deployed service runs the real provider chain, and Groq's
      # free tier allows 8,000 tokens per minute on this model while one
      # hypothesis request costs about 2,077. A 1,500ms pace is roughly 40
      # requests and ~83,000 tokens per minute — about ten times the budget. The
      # provider answers the excess with HTTP 429, the loop treats each as a tier
      # failure, and the session degrades to the enumerator it was supposed to be
      # an upgrade on.
      #
      # 24,000ms is 2.5 requests per minute, ~5,200 tokens per minute, or 65% of
      # the budget. The margin is the point rather than slack: pacing has to
      # absorb the variance in request size, not its average. A sixty-hypothesis
      # run at 16,000ms — 3% clear of break-even — produced 28 model proposals
      # and 32 enumerated ones; the same run at 24,000ms produced 60 of 60 from
      # the model. Both numbers are in `.github/workflows/demo-run.yml`, which
      # derives its own pacing the same way.
      #
      # The cost is wall-clock, and it is disclosed rather than hidden: roughly
      # 25 seconds per hypothesis. Slow, and honestly so — the free tier is the
      # constraint, and a session that runs at the speed the quota allows is a
      # more truthful demonstration than one that outruns it and falls back.
      - key: LOOP_ITERATION_DELAY_MS
        value: "24000"

      # Optional. Blank is a supported configuration (see the note above).
      - key: GROQ_API_KEY
        sync: false
