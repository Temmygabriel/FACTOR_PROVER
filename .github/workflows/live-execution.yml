name: Live paper execution

# Runs apps/agent/src/scripts/live-execution.ts against Bitget's DEMO
# environment, with real credentials and a real `bgc` binary.
#
# WHAT THIS SETTLES. `agentHub.ts` says of itself that the command vector is
# verified and a live placement is not — `LIVE_PLACEMENT_OBSERVED = false`. The
# committed `logs/paper.jsonl` says the same thing in its own header:
# "RECONSTRUCTED, NOT CAPTURED LIVE ... No order here was sent anywhere." So the
# project has a guard, a client and a parser, and not one byte of evidence about
# what the venue does with an order they produce. This workflow produces that
# byte-for-byte, and the artifact it uploads is the record.
#
# TWO ORDERS, TWO DIFFERENT QUESTIONS.
#
#   1. `live_order` — the order the committed decision log implies. That is
#      E-0006 / H-0006, a BUY of RGOOGLUSDT. It is the project's own promoted
#      hypothesis, executed through the production guard and client.
#
#   2. `venue_check` — one order on an instrument of the caller's choosing,
#      recorded under its own `kind` so it can never be read as a promotion. It
#      exists because a refusal on (1) has two possible causes: something wrong
#      with this project, or something about the venue. Without (2) those are
#      indistinguishable and a refusal would be unexplained.
#
# WHY THE VENUE CHECK DEFAULTS TO A SELL. `account_overview --paper-trading`
# returns two wallets. The trading account holds BTC, ETH, USD and USDGO; the
# funding wallet holds the only USDT, and `transfer_funds` answers HTTP 404 in
# demo, so the USDT cannot be moved across. A market BUY needs quote coin (USDT)
# in the trading account and there is none; a market SELL needs base coin (BTC)
# and there is 0.5 available. So a sell is the order this account can actually
# fund, and the side is a fact about the demo wallet rather than a preference.
#
# WHY IT IS SAFE. Every private call the script can cause carries
# `--paper-trading`, which routes to the Demo environment — there is no flag
# combination in this workflow that reaches a funded account. `describeCapability`
# is checked before the guard is built and the script exits without sending if
# execution is not fully configured; it does not degrade to a simulation.
#
# NO CREDENTIAL IS EVER PRINTED. The secrets are passed to the run step and read
# by the CLI from the environment. Nothing in this file echoes them, and no part
# of a value — not a prefix, not a suffix, not a length — is written to the log.
# The one thing reported is presence, by name, so a missing secret is
# distinguishable from a rejected one.

on:
  # A DAILY RUN, because the thing being built here is a TRAIL and not a
  # snapshot. The Agentic Trading track asks for a paper-trading log "actually
  # run during competition period, recommended >= 2 weeks". One run on one day
  # is an anecdote; fourteen consecutive days is a record. This workflow only
  # became able to accumulate one when the script stopped overwriting its own
  # output — see the append note in live-execution.ts.
  #
  # 06:17 UTC rather than on the hour: every scheduled job on GitHub asks for
  # :00, and the queue at that minute is the worst it gets.
  #
  # Scheduled workflows are disabled after 60 days of repository inactivity.
  # The commit step below writes to the repository on every run, which counts
  # as activity, so this re-arms itself for as long as it keeps working.
  schedule:
    - cron: '17 6 * * *'

  workflow_dispatch:
    inputs:
      venue_check:
        description: >-
          SYMBOL:side for the one non-promoted order, e.g. BTCUSDT:sell. Same
          guard, same client, recorded separately. Leave empty to run only the
          promoted order.
        required: false
        default: 'BTCUSDT:sell'

permissions:
  # Was `read`, which was correct while the record was only uploaded as an
  # artifact. It now has to be committed, or the trail exists nowhere durable:
  # the free Render instance has no disk, and CI artifacts expire. This is the
  # second workflow in the repository that writes, and the only one that places
  # orders, which is why the commit step below is as narrow as it can be.
  contents: write

jobs:
  live:
    name: Place the promoted order in demo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Confirm which credentials arrived
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
        run: |
          for v in BITGET_API_KEY BITGET_SECRET_KEY BITGET_PASSPHRASE; do
            val="${!v:-}"
            if [ -z "$val" ]; then
              echo "$v: EMPTY (not set on this repository)"
            else
              echo "$v: present"
            fi
          done

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install the Agent Hub CLI outside the repository
        # Into $RUNNER_TEMP, never the checkout: `bgc` has its own dependency
        # tree and installing it over the project's would make this run's
        # behaviour depend on a merge of two lockfiles that nobody chose.
        run: |
          set -euo pipefail
          TOOLCHAIN="$RUNNER_TEMP/bgc-toolchain"
          mkdir -p "$TOOLCHAIN"
          cd "$TOOLCHAIN"
          npm init -y >/dev/null
          npm install --no-audit --no-fund @bitget-ai/bitget-agent-cli 2>&1 | tail -3
          echo "$TOOLCHAIN/node_modules/.bin" >> "$GITHUB_PATH"
          node -p "require('$TOOLCHAIN/node_modules/@bitget-ai/bitget-agent-cli/package.json').version"

      - name: Show the CLI is resolvable before trusting the run
        # `describeCapability` treats "a bgc binary that actually exists" as one
        # of the three switches. If this step is empty, the run below would
        # refuse for a reason that has nothing to do with the venue.
        run: command -v bgc && bgc --version

      - name: Discover what the venue says about order sizing
        # Added after run 35527828818, which produced this refusal from Bitget:
        #
        #   Parameter verification exception size checkBDScale error
        #   value=0.00123304 checkScale=6
        #
        # `qtyFor` formats a SELL quantity with toFixed(8), and its comment
        # asserts 8 is "the base-coin precision Bitget uses". That assertion is
        # now falsified: BTCUSDT's scale is 6, so the venue rejects the quantity
        # for having more decimals than the instrument has. The notional was
        # fundable and the side was right — the order died on decimal places.
        #
        # Guessing a smaller constant would just move the problem to whichever
        # instrument wants 8. So this asks the CLI where the per-symbol scale
        # actually lives, and the answer decides how `qtyFor` is fixed.
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
        run: |
          probe() {
            label="$1"; shift
            echo ""
            echo "==================================================================="
            echo "## $label"
            echo "==================================================================="
            set +e
            "$@" 2>&1
            echo "--- exit code: $?"
            set -e
          }
          probe "market tool contract" bgc discover --tool market
          probe "search: symbol" bgc discover --search symbol
          probe "search: precision" bgc discover --search precision
          probe "search: scale" bgc discover --search scale

      - name: Run the live execution
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
          # The two switches. Stated explicitly rather than inherited, because
          # the whole run is about what happens when they are ON, and a run that
          # silently fell back to the off state would produce a file that looks
          # like evidence of a placement and is evidence of a simulation.
          BITGET_PAPER_TRADING: 'true'
          ENABLE_EXECUTION: 'true'
        run: |
          set -o pipefail
          npx tsx apps/agent/src/scripts/live-execution.ts \
            --log apps/agent/logs/decisions.jsonl \
            --out apps/agent/logs/paper-live.jsonl \
            --venue-check "${{ inputs.venue_check }}" 2>&1 | tee live.log
          echo "--- exit: $? ---"

      - name: Show what the venue actually said
        # The point of the whole workflow. `parseResult` has never seen a real
        # placement envelope and guesses the order id lives at `data.orderId`;
        # this prints the raw bodies that settle it. Printed with `jq` where it
        # parses and raw where it does not, because a body that fails to parse
        # is itself the finding.
        if: always()
        run: |
          F=apps/agent/logs/paper-live.jsonl
          if [ ! -f "$F" ]; then
            echo "no record was written — the script refused before sending"
            exit 0
          fi
          echo "=== record summary ==="
          tail -n +1 "$F" | grep -v '^#' | while read -r line; do
            echo "$line" | jq -r '"kind=\(.kind) allowed=\(.allowed) refused_at=\(.refused_at // "-") refused_reason=\(.refused_reason // "-")"'
            echo "$line" | jq -r '.cli_calls[]? | "  CLI \(.phase) exit=\(.exit_code)\n  stdout: \(.stdout)"'
          done

      - name: Upload the execution record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-live
          path: apps/agent/logs/paper-live.jsonl
          if-no-files-found: warn

      - name: Commit the record back
        # The guard PROGRESS.md's finding 43 said was missing for the decision
        # log, applied here BEFORE the same mistake can be made rather than
        # after. A run that appended nothing and a run that overwrote everything
        # look identical from the outside — both exit 0, both report success —
        # and only one of them is a loss. So the line count is compared against
        # what is committed, and a record that SHRANK is refused, not committed.
        if: always()
        run: |
          set -euo pipefail
          F=apps/agent/logs/paper-live.jsonl
          if [ ! -f "$F" ]; then
            echo "no record was written — nothing to commit"
            exit 0
          fi

          BEFORE=$(git show "HEAD:$F" 2>/dev/null | wc -l | tr -d ' ')
          AFTER=$(wc -l < "$F" | tr -d ' ')
          echo "committed record: $BEFORE lines -> $AFTER lines"

          if [ "$AFTER" -lt "$BEFORE" ]; then
            echo "::error::$F SHRANK from $BEFORE to $AFTER lines. A paper-trading"
            echo "::error::trail that gets shorter is a loss of evidence, not a"
            echo "::error::successful run. Nothing was committed."
            exit 1
          fi

          git add "$F"
          if git diff --cached --quiet; then
            echo "record is unchanged — nothing to commit"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Append the paper execution record ($AFTER lines)" \
                     -m "Placed by .github/workflows/live-execution.yml. Every call carried --paper-trading (demo only)."
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Live paper execution"
            echo
            echo "- every private call carried \`--paper-trading\` (demo funds only)"
            echo "- \`live_order\` = the committed promotion, executed for real"
            echo "- \`venue_check\` = \`${{ inputs.venue_check }}\`, a non-promoted order"
            echo "  on an instrument this demo wallet can actually fund"
            echo
            if [ -f apps/agent/logs/paper-live.jsonl ]; then
              echo '```'
              grep -v '^#' apps/agent/logs/paper-live.jsonl \
                | jq -r '"\(.kind): \(.symbol) \(.side) -> allowed=\(.allowed) refused_at=\(.refused_at // "-")"'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
