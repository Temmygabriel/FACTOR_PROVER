name: Demo run

# Produces the decision log — the one durable artifact this project is judged on.
#
# WHY THIS IS A WORKFLOW AND NOT A BUTTON ON THE SITE. The agent is deployed on
# Render's free tier, which has no persistent disk. The container is replaced
# whenever the service sleeps, and `apps/agent/logs/decisions.jsonl` is replaced
# with it. A session that runs for an hour on a filesystem that forgets is not a
# record, and a judge who opens the URL after any idle period sees an empty
# product however good the interface is around it.
#
# A GitHub runner has a real filesystem, and the frozen dataset the verdicts are
# computed from is committed. So the same `SessionLoop` the deployed server runs
# can be run here, to completion, and the log it writes can be committed — which
# is what makes it durable, checkable and re-runnable.
#
# NO SECRETS, NO ACCOUNTS, NO CARD. With no provider keys configured the loop
# falls through to its deterministic enumerator, which is a pure function of the
# attempt index. That is what makes the run reproducible, and it is also why this
# workflow needs nothing set up: a judge with a GitHub login can press Run and
# get the same session. Nothing here is billed to anyone.
#
# ANYONE CAN RUN IT. Actions tab -> Demo run -> Run workflow. The default input
# is the policy's own daily ceiling, so the default run stops where the
# preregistered rules say a session must stop rather than being cut off by them.
#
# IT DOES NOT TRADE. `BITGET_PAPER_TRADING` and `ENABLE_EXECUTION` are left
# unset on purpose, so the Execution Guard refuses every order intent at CHECK 1.
# A promoted factor is still logged with its full evidence; the order that would
# follow it is declined and the refusal is recorded.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: >-
          Hypotheses to attempt. The default is the policy's own
          max_hypotheses_per_day, which is also the number the circuit breaker
          enforces — a larger value is allowed but the session will halt on the
          breaker and record a CIRCUIT_BREAK entry when it gets there.
        required: true
        default: '200'
      commit:
        description: >-
          Commit the resulting log back to this branch. Set false to CHECK that
          a committed log reproduces without changing anything: the run still
          compares its decisions against the committed log and fails if they
          differ, but leaves the working tree alone.
        type: boolean
        default: true

# Pushing the log back needs write access. Everything else in this repository
# runs with `contents: read`; this is the one workflow that writes.
permissions:
  contents: write

# Never cancel a run in progress: it would leave a half-written log in the
# working tree, and the next run would compare against it. Queue instead.
concurrency:
  group: demo-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-session:
    name: Run a session and commit the log
    runs-on: ubuntu-latest

    # Raised from 45 when this workflow learned to use a provider key. The
    # arithmetic is not slack, it is the provider's: Groq's free tier allows
    # 8,000 tokens per minute on this model, a hypothesis request costs about
    # 2,077 of them, so the fastest an honest keyed session can go is one
    # hypothesis every ~15.5s. The policy's own daily ceiling of 200 therefore
    # needs ~52 minutes of wall clock before any overhead, and the old 45 would
    # have killed a run that was working correctly. A keyless run is unaffected:
    # the enumerator is a pure function and finishes in seconds.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # Kept so the commit step can push with the run's own GITHUB_TOKEN.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 24 — and the reason is not the one that used to be written here.
          #
          # This job previously pinned 20, on the stated grounds that 20 is the
          # version the Render service runs, so the session would be produced by
          # the same runtime as the live one. That was simply false: render.yaml
          # pins NODE_VERSION to 24. Worse, the pin broke the workflow outright —
          # the frozen-dataset step below runs `node
          # --experimental-strip-types`, a flag Node 20 does not have, so the job
          # died on `node: bad option` with exit code 9 before the session ever
          # started. ci.yml's frozen-dataset job had it right from the start: it
          # pins 24 for exactly this command.
          #
          # So 24 is the fix AND it makes the original intent true. The live
          # service runs 24, so a session produced here is produced by the same
          # runtime as the deployed one.
          node-version: '24'

      - name: Install dependencies
        # `npm install`, not `npm ci` — there is no committed lockfile yet, which
        # is a known gap rather than an oversight. See PROGRESS.md.
        run: npm install --no-audit --no-fund

      - name: Verify the frozen dataset before using it
        # Everything below is computed from these bytes, and every entry records
        # their hash. Checking them first means a run cannot quietly produce a
        # log against a dataset that does not match the committed one.
        run: node --experimental-strip-types apps/agent/scripts/rebuild-manifest.ts --check

      - name: Run the session
        env:
          # Stated rather than left to the default, because the whole run depends
          # on it: this is what makes a keyless session deterministic instead of
          # failing with no proposals at all.
          LLM_ALLOW_DETERMINISTIC_FALLBACK: 'true'
          # OPTIONAL, and the workflow is designed around its absence. With no
          # secret set these resolve to the empty string, the generator chain
          # reports every tier as `(no key)`, and the session falls through to the
          # deterministic enumerator — which is what keeps this workflow's
          # original promise intact: a judge with a GitHub login can press Run and
          # get a complete, reproducible session without configuring anything, and
          # without anything being billed to anyone.
          #
          # Set GROQ_API_KEY as a repository secret and the same workflow runs the
          # real provider chain instead, and the log it commits was proposed by a
          # model rather than by a pure function. The two runs differ in exactly
          # that one respect and say so in their commit messages.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # NOTE: BITGET_PAPER_TRADING and ENABLE_EXECUTION are deliberately NOT
          # set. Any promoted factor's order intent is refused at Execution Guard
          # CHECK 1 and the refusal is recorded. This workflow never trades.
        run: |
          set -o pipefail

          # Pacing, derived from whether a model is actually answering.
          #
          # A keyless run needs no delay at all: the enumerator is a pure
          # function of the attempt index and completes in seconds.
          #
          # A keyed run is bounded by the provider's own budget. Groq's free tier
          # gives this model 8,000 tokens per minute and one hypothesis request
          # costs roughly 2,077, so ~15.5s between requests is the fastest rate
          # that does not simply generate 429s. 16,000ms sits just under it.
          #
          # This is pacing, not protection: a request that still gets throttled is
          # retried by the provider layer using the reset hint in the response,
          # and a throttle does not count against the circuit breaker — a 429 says
          # this loop asked too fast, which is a fact about this loop, not about
          # the provider's health.
          if [ -n "${GROQ_API_KEY:-}" ] || [ -n "${GEMINI_API_KEY:-}" ]; then
            DELAY_MS=16000
            echo "[run] a provider key is set — pacing at ${DELAY_MS}ms between hypotheses"
          else
            DELAY_MS=0
            echo "[run] no provider key is set — the deterministic enumerator needs no pacing"
          fi

          npx tsx apps/agent/src/scripts/run-session.ts \
            --iterations "${{ inputs.iterations }}" \
            --delay-ms "$DELAY_MS" \
            --out apps/agent/logs/decisions.jsonl \
            --replace 2>&1 | tee demo-run.log

      - name: Verify the log, as a reader would
        # Deliberately AFTER the runner, which already verified the file it wrote.
        # This is the command the README tells a sceptical reader to run, against
        # the bytes on disk, through the standalone CLI entry point — so the
        # workflow demonstrates the reproduction path instead of only claiming it
        # works. ci.yml depends on that same entry-point detection being live.
        run: |
          set -o pipefail
          npx tsx apps/agent/src/log/verify.ts \
            --file apps/agent/logs/decisions.jsonl 2>&1 | tee verify.log
          if ! grep -qE '^(PASS|FAIL) — ' verify.log; then
            echo "::error::the verifier produced no PASS/FAIL report — it did not run"
            exit 1
          fi

      - name: Commit the log
        if: ${{ inputs.commit }}
        # Re-declared rather than inherited: each `run:` step is its own shell, so
        # the env set on the session step above does not reach this one. The
        # commit message branches on it, so without this the message would always
        # describe the keyless run.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          LOG=apps/agent/logs/decisions.jsonl

          if [ ! -f "$LOG" ]; then
            echo "::error::the run produced no log"
            exit 1
          fi

          # Evidence that the run reached its own verification step. A missing
          # PASS line means the runner did not get that far, and committing a
          # log that was never verified is the one thing this must not do.
          if ! grep -qE '^\[run\] PASS — ' demo-run.log; then
            echo "::error::the runner never reported PASS — the log is not to be committed"
            exit 1
          fi

          # Checked rather than assumed. If the path were ever gitignored, a
          # plain `git add` would stage nothing, the diff check below would find
          # no change, and this step would report success having committed
          # nothing at all.
          if git check-ignore -q "$LOG"; then
            echo "::error::$LOG is ignored by .gitignore — it is a submission artifact"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOG"

          if git diff --cached --quiet; then
            echo "the run reproduced the committed log exactly; nothing to commit"
            exit 0
          fi

          ENTRIES=$(wc -l < "$LOG" | tr -d ' ')

          # The commit message has to say which of the two runs this was, because
          # the difference is the whole point of the artifact: a judge reading the
          # log needs to know whether the hypotheses in it were proposed by a
          # model or by a pure function. Claiming "reproducible" over a
          # model-proposed log would be false — sampling differs run to run — and
          # claiming "model-driven" over an enumerator log would be the exact kind
          # of overstatement this project exists to avoid.
          # No backticks anywhere in these two strings, and that is a rule rather
          # than a style. The assignment is a double-quoted shell string, so a
          # backtick inside it is command substitution: the words between a pair
          # of them are run as a command and replaced by its output. The first
          # draft of this message wrapped `commit: false` in backticks, and the
          # rendered message lost those two words and reported
          # "commit:: command not found" — silently, because a failing command
          # substitution in an assignment does not stop the script.
          if [ -n "${GROQ_API_KEY:-}" ] || [ -n "${GEMINI_API_KEY:-}" ]; then
            PROPOSER_SUMMARY="Proposals came from the live provider chain: each hypothesis was
          proposed by a model, and the tier that answered is recorded on the entry.
          The session is therefore NOT bit-reproducible — a second run samples
          differently. What IS reproducible is every judgement made about it: the
          gate is a deterministic function of the hypothesis, the committed frozen
          dataset and the frozen policy, all three hashed into the entry, so each
          verdict can be re-derived from the log alone. To check the enumerated
          path instead, re-run this workflow without a key and with commit set to
          false."
          else
            PROPOSER_SUMMARY="Proposals came from the deterministic enumerator, since no provider key
          is configured. That makes the session itself reproducible: run this
          workflow again, with or without a key, and the enumerated entries
          reproduce exactly."
          fi

          # `--cleanup=strip` stated explicitly. The message is written as an
          # indented heredoc inside a YAML block scalar, so every line arrives
          # carrying the block's ten spaces of indentation, and `$PROPOSER_SUMMARY`
          # is a multi-line variable whose continuation lines carry it too. Git's
          # default cleanup happens to remove them, but relying on a default for
          # the shape of the one message that says whether a model proposed these
          # hypotheses is a bad trade.
          git commit --cleanup=strip -F - <<MSG
          demo run: session on the frozen dataset

          Produced by .github/workflows/demo-run.yml, which runs the same
          SessionLoop the deployed server runs, against the committed frozen
          dataset.

          $PROPOSER_SUMMARY

          The log is hash-chained and verifies; every entry records the policy
          and dataset hashes it was computed against. KILLED verdicts outnumber
          PROMOTED ones by design — that is the result, not a failure.

          Co-Authored-By: Claude Code <noreply@anthropic.com>
          MSG

          git push origin "HEAD:${{ github.ref_name }}"
          echo "committed $ENTRIES entries to ${{ github.ref_name }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Demo run"
            echo
            if [ -f apps/agent/logs/decisions.jsonl ]; then
              entries=$(wc -l < apps/agent/logs/decisions.jsonl | tr -d ' ')
              echo "- entries: **$entries**"
            else
              echo "- no log was produced"
            fi
            echo "- committed: \`${{ inputs.commit }}\`"
            echo
            echo '```'
            if [ -f demo-run.log ]; then
              # The runner's own closing block: the verdict tally, why each
              # hypothesis was decided, the head hash, and PASS/FAIL.
              sed -n '/^\[run\] finished/,$p' demo-run.log
            else
              echo "the run produced no output"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
