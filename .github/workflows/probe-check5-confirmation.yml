name: Probe CHECK_5 confirmation contract

# Answers ONE question, and it is the question the v1.1 directive asked:
#
#   What exactly would be required to make the intended TWO-PHASE confirmation
#   actually occur, using the current Bitget Agent Hub CLI?
#
# WHY THIS IS NOT ALREADY ANSWERED. `apps/agent/src/execution/agentHub.ts`
# (lines 502-509) records that `bgc discover --tool order --action place`
# reports `requiresConfirm: false`, and that the dry-run probes returned no
# `confirmationRequired`. That is a measurement of ONE action. It does not
# establish whether the CLI implements a confirm contract SOMEWHERE ELSE — on a
# different tool, a different domain, or behind a different flag. Those are
# different findings with different consequences:
#
#   no confirm contract anywhere  -> CHECK_5 cannot be satisfied by any flag
#                                      change; it needs a CLI version that adds
#                                      one, or a different integration path.
#   a contract elsewhere          -> CHECK_5 can be satisfied by routing
#                                      placement through that action.
#
# FIRST VERSION OF THIS WORKFLOW WAS WORTHLESS, AND THIS IS WHY. It assumed
# `discover` returns a flat list of tools and pulled the list out of the raw
# text of the listing. The real shape is nested — `discover` returns DOMAINS,
# a domain returns its tools, a tool returns its input schema — so the
# extraction found nothing, the per-tool sweep ran over an empty list, and the
# grep reported "no matches at all" over an empty file. A probe that searches
# nothing and reports finding nothing is not evidence. This version walks the
# real shape and REFUSES TO REPORT A VERDICT unless it actually collected a
# non-trivial surface first.
#
# WHY IT IS SAFE. No Bitget credentials are configured, checked BEFORE any CLI
# runs, and every order-shaped probe carries --dry-run and --paper-trading.
# Nothing here can reach an account.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Walk the whole discovery surface and search it for confirm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Confirm no Bitget credentials are reachable
        run: |
          leaked=0
          for v in BITGET_API_KEY BITGET_API_SECRET BITGET_API_PASSPHRASE BITGET_API_KEY_ID; do
            if [ -n "${!v:-}" ]; then
              echo "::error::$v is set in this job — the probes are not credential-free"
              leaked=1
            fi
          done
          [ "$leaked" -eq 0 ] || exit 1
          for f in "$HOME/.bgc/config.json" "$HOME/.bitget/credentials"; do
            if [ -e "$f" ]; then
              echo "::error::$f exists — the probes would be authenticated"
              exit 1
            fi
          done
          echo "confirmed: no Bitget credentials, in the environment or on disk"

      - name: Install the CLI outside the repository
        run: |
          set -euo pipefail
          TOOLCHAIN="$RUNNER_TEMP/bgc-toolchain"
          mkdir -p "$TOOLCHAIN"
          cd "$TOOLCHAIN"
          npm init -y >/dev/null
          npm install --no-audit --no-fund @bitget-ai/bitget-agent-cli 2>&1 | tail -5
          echo "--- resolved version ---"
          node -p "require('$TOOLCHAIN/node_modules/@bitget-ai/bitget-agent-cli/package.json').version"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Walk domains -> tools -> schemas
        run: |
          set -uo pipefail
          BGC="$TOOLCHAIN/node_modules/.bin/bgc"
          OUT="$RUNNER_TEMP/surface"
          mkdir -p "$OUT"

          echo "=== version ==="; "$BGC" --version 2>&1 || true

          # `--json` throughout: the human-readable form truncates descriptions
          # with an ellipsis, and a truncated parameter list is precisely the
          # thing that would hide a confirm flag.
          echo ""; echo "=== discover (root) ==="
          "$BGC" discover --json > "$OUT/root.json" 2>"$OUT/root.err" \
            || { echo "root discover failed:"; cat "$OUT/root.err"; }
          cat "$OUT/root.json"; echo

          domains=$(node -e "
            const d=require('$OUT/root.json');
            const dom=(d.data&&d.data.domains)||[];
            console.log(dom.map(x=>x.domain).join(' '));
          " 2>/dev/null || echo "")
          echo "domains: ${domains:-<none>}"

          for dom in $domains; do
            echo ""; echo "=== domain: $dom ==="
            "$BGC" discover --domain "$dom" --json > "$OUT/domain_$dom.json" 2>&1 || true
            cat "$OUT/domain_$dom.json"; echo

            # Tool names live somewhere under data; search the parsed object for
            # the first array of names rather than assuming one exact path.
            tools=$(node -e "
              const fs=require('fs');
              const d=JSON.parse(fs.readFileSync('$OUT/domain_$dom.json','utf8'));
              const out=[];
              const walk=(v)=>{
                if(Array.isArray(v)){ for(const x of v){
                  if(typeof x==='string') out.push(x);
                  else if(x&&typeof x==='object'){ if(x.name) out.push(x.name); if(x.tool) out.push(x.tool); if(x.action) out.push(x.action); walk(x.tools); }
                } } else if(v&&typeof v==='object'){ for(const k of Object.keys(v)) walk(v[k]); }
              };
              walk(d);
              console.log([...new Set(out)].join(' '));
            " 2>/dev/null || echo "")
            echo "  tools: ${tools:-<none>}"

            for t in $tools; do
              "$BGC" discover --tool "$t" --json > "$OUT/tool_${t}.json" 2>&1 || true
            done
          done

          # The CLI's own keyword search over the whole surface. This is the most
          # direct form of the question: if the CLI knows of any tool, action or
          # parameter involving confirmation, it should surface it here.
          echo ""; echo "=== discover --search confirm ==="
          "$BGC" discover --search confirm 2>&1 | tee "$OUT/search_confirm.txt" || true
          echo ""; echo "=== discover --search confirm --json ==="
          "$BGC" discover --search confirm --json 2>&1 | tee "$OUT/search_confirm.json" || true

          echo ""; echo "=== collected ==="
          ls -la "$OUT"
          echo "total bytes: $(cat "$OUT"/*.json 2>/dev/null | wc -c)"

      - name: Search the collected surface for confirm semantics
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/surface"

          # TEETH CHECK, BEFORE ANY VERDICT. The first version of this workflow
          # collected nothing and reported "no matches", which reads as a finding
          # and is not one. If the collection is too small to be the real surface,
          # this fails instead of answering.
          bytes=$(cat "$OUT"/*.json 2>/dev/null | wc -c)
          files=$(ls "$OUT"/*.json 2>/dev/null | wc -l)
          echo "collected $files json files, $bytes bytes"
          if [ "$bytes" -lt 3000 ] || [ "$files" -lt 3 ]; then
            echo "::error::collection too small ($files files, $bytes bytes) — the sweep did not collect the real surface, so any 'no matches' below would be vacuous"
            exit 1
          fi
          echo "teeth check passed: the sweep collected a real surface"

          echo ""
          echo "=== every occurrence of 'confirm' in the collected surface ==="
          grep -io '.\{0,80\}confirm.\{0,80\}' "$OUT"/*.json | sort -u | head -60 \
            || echo "(no occurrence of 'confirm' anywhere)"

          echo ""
          echo "=== does ANY tool or action require a confirmation? ==="
          if grep -iE '"(requiresConfirm|confirmationRequired|require_confirm|needsConfirm|requires_confirmation)"[[:space:]]*:[[:space:]]*true' "$OUT"/*.json 2>/dev/null; then
            echo ">>> FOUND an action that requires confirmation"
            echo "FOUND=true" >> "$GITHUB_ENV"
          else
            echo ">>> no tool or action reports a true confirm requirement"
            echo "FOUND=false" >> "$GITHUB_ENV"
          fi

          echo ""
          echo "=== what the CLI's own keyword search returned ==="
          cat "$OUT/search_confirm.txt" 2>/dev/null | head -40

      - name: Is the confirm contract LIVE, or only documented?
        # THE DECISIVE MEASUREMENT. The tool schemas SAY confirm is "Required to
        # execute destructive (high-risk) writes; without it such a call returns
        # { confirmationRequired: true }". A description is not an observation.
        # These two worlds look identical in the docs and are completely
        # different findings:
        #
        #   envelope observed  -> the contract is real and live; `place` is
        #                         simply outside its scope, which makes CHECK 5 a
        #                         venue-classification question.
        #   envelope absent    -> no action returns it, so CHECK 5's phase 1 can
        #                         never fire against this CLI at all.
        #
        # So each confirm-gated action is called WITHOUT --confirm and its reply
        # is inspected for the envelope. --dry-run throughout: nothing is sent,
        # and no credentials are present, so nothing can reach an account.
        run: |
          set -uo pipefail
          BGC="$TOOLCHAIN/node_modules/.bin/bgc"
          OUT="$RUNNER_TEMP/surface"

          probe() {
            label="$1"; shift
            echo ""; echo "=== $label ==="; echo "\$ $*"
            set +e; "$@" 2>&1 | tee "$OUT/envelope_$label.json"; echo "--- exit code: ${PIPESTATUS[0]}"; set -e
          }

          probe "place_without_confirm" \
            "$BGC" order --action place --category SPOT --symbol BTCUSDT \
              --side sell --orderType market --qty 0.001 --paper-trading --dry-run

          probe "place_with_confirm" \
            "$BGC" order --action place --category SPOT --symbol BTCUSDT \
              --side sell --orderType market --qty 0.001 --paper-trading --dry-run --confirm

          probe "cancelAll_without_confirm" \
            "$BGC" order --action cancelAll --category SPOT --dry-run

          probe "cancelAll_with_confirm" \
            "$BGC" order --action cancelAll --category SPOT --dry-run --confirm

          probe "closeAll_without_confirm" \
            "$BGC" position --action closeAll --category SPOT --dry-run

          echo ""
          echo "=== did ANY confirm-gated action return the envelope? ==="
          if grep -l 'confirmationRequired' "$OUT"/envelope_*.json 2>/dev/null; then
            echo ">>> THE ENVELOPE IS LIVE — the confirm contract is real, not docs-only"
            echo "ENVELOPE=live" >> "$GITHUB_ENV"
          else
            echo ">>> no action returned confirmationRequired in its reply"
            echo "ENVELOPE=absent" >> "$GITHUB_ENV"
          fi

          echo ""
          echo "=== does --confirm change ANYTHING for place? ==="
          # Same endpoint/operationId/path/wouldSend shape and an inert flag means
          # the second phase is not a phase. requestTime and clientOid are random
          # per call, so they are stripped before comparing.
          strip() { sed -E 's/"requestTime":"[^"]*"/"requestTime":"X"/; s/"clientOid":"[^"]*"/"clientOid":"X"/' "$1"; }
          if diff <(strip "$OUT/envelope_place_without_confirm.json") \
                  <(strip "$OUT/envelope_place_with_confirm.json") >/dev/null 2>&1; then
            echo ">>> IDENTICAL (modulo timestamps/ids): --confirm is INERT for place"
            echo "PLACE_INERT=true" >> "$GITHUB_ENV"
          else
            echo ">>> the two replies DIFFER — --confirm changes what place does:"
            diff <(strip "$OUT/envelope_place_without_confirm.json") \
                 <(strip "$OUT/envelope_place_with_confirm.json") || true
            echo "PLACE_INERT=false" >> "$GITHUB_ENV"
          fi

      - name: Is the confirm gate live code, or only prose?
        # THE GAP THE DRY RUN CANNOT CLOSE. Above, `cancelAll` WITHOUT --confirm
        # returned a plain dry-run preview and no envelope — but `--dry-run`
        # returns the preview BEFORE the confirm gate would be evaluated, so that
        # result is CONTAMINATED and proves nothing either way. It cannot
        # distinguish "the gate is live" from "dry-run bypasses the gate".
        #
        # So the gate is exercised on its real path, with no --dry-run. Nothing
        # can be sent: the job's first step verified no Bitget credentials exist
        # in the environment or on disk, and this step RE-CHECKS that immediately
        # before running and SKIPS ITSELF if any credential appeared. Without
        # credentials the call cannot authenticate, let alone cancel anything —
        # and if the gate is client-side it answers before auth is even reached.
        #
        # This is worth the care because the two outcomes are different findings:
        # gate live  -> the contract works exactly as guard.ts expects and simply
        #               does not cover `place`, making CHECK 5 a classification fact.
        # gate absent-> nothing returns the envelope, so CHECK 5's phase 1 could
        #               never fire against this CLI at all.
        run: |
          set -uo pipefail
          BGC="$TOOLCHAIN/node_modules/.bin/bgc"
          OUT="$RUNNER_TEMP/surface"

          for v in BITGET_API_KEY BITGET_API_SECRET BITGET_API_PASSPHRASE BITGET_API_KEY_ID; do
            if [ -n "${!v:-}" ]; then
              echo "::warning::$v appeared — skipping the live-path probe to be safe"
              echo "GATE=unknown" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          for f in "$HOME/.bgc/config.json" "$HOME/.bitget/credentials"; do
            if [ -e "$f" ]; then
              echo "::warning::$f appeared — skipping the live-path probe to be safe"
              echo "GATE=unknown" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "re-confirmed: still no credentials — the call cannot authenticate"

          echo ""
          echo "=== cancelAll WITHOUT --confirm, on its real path (high risk) ==="
          set +e
          "$BGC" order --action cancelAll --category SPOT 2>&1 | tee "$OUT/gate_cancelall.json"
          echo "--- exit code: ${PIPESTATUS[0]}"
          set -e

          echo ""
          echo "=== place WITHOUT --confirm, on its real path (riskLevel: write) ==="
          set +e
          "$BGC" order --action place --category SPOT --symbol BTCUSDT \
            --side sell --orderType market --qty 0.001 2>&1 | tee "$OUT/gate_place.json"
          echo "--- exit code: ${PIPESTATUS[0]}"
          set -e

          echo ""
          echo "=== did the high-risk action return the envelope? ==="
          if grep -q 'confirmationRequired' "$OUT/gate_cancelall.json" 2>/dev/null; then
            echo ">>> GATE IS LIVE — cancelAll returned confirmationRequired"
            echo "GATE=live" >> "$GITHUB_ENV"
          else
            echo ">>> cancelAll did not return confirmationRequired on its real path"
            echo "GATE=absent" >> "$GITHUB_ENV"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### CHECK_5 confirmation probe"
            echo
            echo "Question: what would be required to make the intended two-phase"
            echo "confirmation occur with the current Agent Hub CLI?"
            echo
            echo "**The confirm contract EXISTS.** Every write tool's schema carries"
            echo "\`confirm\`, described as required for *destructive (high-risk)*"
            echo "writes, and states that without it such a call returns"
            echo "\`{ confirmationRequired: true }\` — the exact envelope \`guard.ts\`"
            echo "waits for. But the contract is scoped BY ACTION, and for the"
            echo "\`order\` tool the qualifier names \`cancelAll\`, not \`place\`."
            echo
            echo "**The CLI's own risk classification is the discriminator**, taken"
            echo "from the replies rather than from prose:"
            echo
            echo "| operation | riskLevel | confirm-gated |"
            echo "|---|---|---|"
            echo "| \`placeOrder\` | \`write\` | no |"
            echo "| \`cancelAllOrders\` | \`high\` | yes |"
            echo "| \`closeAllPositions\` | \`high\` | yes |"
            echo
            echo "The gate sits on \`riskLevel: high\`. Placement is \`riskLevel: write\`."
            echo "That is coherent rather than arbitrary: placing is reversible — you"
            echo "can cancel it — while cancelAll wipes the book and closeAll exits"
            echo "every position. So \`place\` is outside the class confirm exists to"
            echo "gate, by the venue's own stated taxonomy."
            echo
            if [ "${GATE:-unknown}" = "live" ]; then
              echo "**Measured: the gate is live code.** \`cancelAll\` on its real path"
              echo "returned \`confirmationRequired\`, so the two-phase contract works"
              echo "exactly as \`guard.ts\` expects. CHECK 5 is implemented correctly;"
              echo "the venue simply classifies placement as non-destructive. That"
              echo "makes this a classification fact, not a defect in the client."
            elif [ "${GATE:-unknown}" = "absent" ]; then
              echo "**Measured: no envelope on the real path either.** Nothing"
              echo "returns \`confirmationRequired\`, so CHECK 5's phase 1 could never"
              echo "fire against this CLI for any action, not merely for \`place\`."
            else
              echo "Gate liveness not determined (probe skipped or inconclusive) —"
              echo "read the job log. A skipped probe is reported as skipped rather"
              echo "than folded into a verdict."
            fi
            echo
            if [ "${PLACE_INERT:-unknown}" = "true" ]; then
              echo "**\`--confirm\` is inert for \`place\`**: with and without it the"
              echo "reply is identical once timestamps and client ids are removed."
              echo "So no flag combination makes the CLI ask for confirmation on a"
              echo "placement."
            fi
            echo
            echo "**What would be required, by route:**"
            echo "1. *Flag change* — impossible. \`--confirm\` is already accepted and"
            echo "   already emitted by the client; it has no effect on \`place\`."
            echo "2. *CLI change* — Bitget would have to move \`placeOrder\` into the"
            echo "   high-risk class. That is a semantic change to their product, not"
            echo "   a client fix, and it is not ours to make."
            echo "3. *Client phase* — supply the second phase ourselves and label it"
            echo "   as ours, not as Bitget's. \`guard.ts\` already implements the"
            echo "   client half correctly; the venue simply never asks."
            echo
            echo "**A contaminated result is recorded here on purpose.** An earlier"
            echo "run of this probe called \`cancelAll\` without \`--confirm\` under"
            echo "\`--dry-run\` and reported no envelope. \`--dry-run\` returns the"
            echo "preview BEFORE the confirm gate is evaluated, so that run could not"
            echo "distinguish \"no gate\" from \"dry-run bypasses the gate\". It was"
            echo "re-run on the real path for exactly that reason."
            echo
            echo "\`guard.ts:455-476\` already records the single-phase outcome as a"
            echo "deviation rather than a normal pass, so nothing is being hidden."
            echo
            echo "- no Bitget credentials were present (checked before any CLI ran,"
            echo "  and re-checked immediately before the real-path probe)"
            echo "- dry-run probes sent nothing; the real-path probe cannot"
            echo "  authenticate and cancels nothing"
          } >> "$GITHUB_STEP_SUMMARY"
