name: Probe CHECK_5 confirmation contract

# Answers ONE question, and it is the question the v1.1 directive asked:
#
#   What exactly would be required to make the intended TWO-PHASE confirmation
#   actually occur, using the current Bitget Agent Hub CLI?
#
# WHY THIS IS NOT ALREADY ANSWERED. `apps/agent/src/execution/agentHub.ts`
# (lines 502-509) records that `bgc discover --tool order --action place`
# reports `requiresConfirm: false`, and that the dry-run probes returned no
# `confirmationRequired`. That is a measurement of ONE action. It does not
# establish whether the CLI implements a confirm contract SOMEWHERE ELSE — on a
# different tool, a different domain, or behind a different flag. Those are
# different findings with different consequences:
#
#   no confirm contract anywhere  -> CHECK_5 cannot be satisfied by any flag
#                                      change; it needs a CLI version that adds
#                                      one, or a different integration path.
#   a contract elsewhere          -> CHECK_5 can be satisfied by routing
#                                      placement through that action.
#
# FIRST VERSION OF THIS WORKFLOW WAS WORTHLESS, AND THIS IS WHY. It assumed
# `discover` returns a flat list of tools and pulled the list out of the raw
# text of the listing. The real shape is nested — `discover` returns DOMAINS,
# a domain returns its tools, a tool returns its input schema — so the
# extraction found nothing, the per-tool sweep ran over an empty list, and the
# grep reported "no matches at all" over an empty file. A probe that searches
# nothing and reports finding nothing is not evidence. This version walks the
# real shape and REFUSES TO REPORT A VERDICT unless it actually collected a
# non-trivial surface first.
#
# WHY IT IS SAFE. No Bitget credentials are configured, checked BEFORE any CLI
# runs, and every order-shaped probe carries --dry-run and --paper-trading.
# Nothing here can reach an account.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Walk the whole discovery surface and search it for confirm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Confirm no Bitget credentials are reachable
        run: |
          leaked=0
          for v in BITGET_API_KEY BITGET_API_SECRET BITGET_API_PASSPHRASE BITGET_API_KEY_ID; do
            if [ -n "${!v:-}" ]; then
              echo "::error::$v is set in this job — the probes are not credential-free"
              leaked=1
            fi
          done
          [ "$leaked" -eq 0 ] || exit 1
          for f in "$HOME/.bgc/config.json" "$HOME/.bitget/credentials"; do
            if [ -e "$f" ]; then
              echo "::error::$f exists — the probes would be authenticated"
              exit 1
            fi
          done
          echo "confirmed: no Bitget credentials, in the environment or on disk"

      - name: Install the CLI outside the repository
        run: |
          set -euo pipefail
          TOOLCHAIN="$RUNNER_TEMP/bgc-toolchain"
          mkdir -p "$TOOLCHAIN"
          cd "$TOOLCHAIN"
          npm init -y >/dev/null
          npm install --no-audit --no-fund @bitget-ai/bitget-agent-cli 2>&1 | tail -5
          echo "--- resolved version ---"
          node -p "require('$TOOLCHAIN/node_modules/@bitget-ai/bitget-agent-cli/package.json').version"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Walk domains -> tools -> schemas
        run: |
          set -uo pipefail
          BGC="$TOOLCHAIN/node_modules/.bin/bgc"
          OUT="$RUNNER_TEMP/surface"
          mkdir -p "$OUT"

          echo "=== version ==="; "$BGC" --version 2>&1 || true

          # `--json` throughout: the human-readable form truncates descriptions
          # with an ellipsis, and a truncated parameter list is precisely the
          # thing that would hide a confirm flag.
          echo ""; echo "=== discover (root) ==="
          "$BGC" discover --json > "$OUT/root.json" 2>"$OUT/root.err" \
            || { echo "root discover failed:"; cat "$OUT/root.err"; }
          cat "$OUT/root.json"; echo

          domains=$(node -e "
            const d=require('$OUT/root.json');
            const dom=(d.data&&d.data.domains)||[];
            console.log(dom.map(x=>x.domain).join(' '));
          " 2>/dev/null || echo "")
          echo "domains: ${domains:-<none>}"

          for dom in $domains; do
            echo ""; echo "=== domain: $dom ==="
            "$BGC" discover --domain "$dom" --json > "$OUT/domain_$dom.json" 2>&1 || true
            cat "$OUT/domain_$dom.json"; echo

            # Tool names live somewhere under data; search the parsed object for
            # the first array of names rather than assuming one exact path.
            tools=$(node -e "
              const fs=require('fs');
              const d=JSON.parse(fs.readFileSync('$OUT/domain_$dom.json','utf8'));
              const out=[];
              const walk=(v)=>{
                if(Array.isArray(v)){ for(const x of v){
                  if(typeof x==='string') out.push(x);
                  else if(x&&typeof x==='object'){ if(x.name) out.push(x.name); if(x.tool) out.push(x.tool); if(x.action) out.push(x.action); walk(x.tools); }
                } } else if(v&&typeof v==='object'){ for(const k of Object.keys(v)) walk(v[k]); }
              };
              walk(d);
              console.log([...new Set(out)].join(' '));
            " 2>/dev/null || echo "")
            echo "  tools: ${tools:-<none>}"

            for t in $tools; do
              "$BGC" discover --tool "$t" --json > "$OUT/tool_${t}.json" 2>&1 || true
            done
          done

          # The CLI's own keyword search over the whole surface. This is the most
          # direct form of the question: if the CLI knows of any tool, action or
          # parameter involving confirmation, it should surface it here.
          echo ""; echo "=== discover --search confirm ==="
          "$BGC" discover --search confirm 2>&1 | tee "$OUT/search_confirm.txt" || true
          echo ""; echo "=== discover --search confirm --json ==="
          "$BGC" discover --search confirm --json 2>&1 | tee "$OUT/search_confirm.json" || true

          echo ""; echo "=== collected ==="
          ls -la "$OUT"
          echo "total bytes: $(cat "$OUT"/*.json 2>/dev/null | wc -c)"

      - name: Search the collected surface for confirm semantics
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/surface"

          # TEETH CHECK, BEFORE ANY VERDICT. The first version of this workflow
          # collected nothing and reported "no matches", which reads as a finding
          # and is not one. If the collection is too small to be the real surface,
          # this fails instead of answering.
          bytes=$(cat "$OUT"/*.json 2>/dev/null | wc -c)
          files=$(ls "$OUT"/*.json 2>/dev/null | wc -l)
          echo "collected $files json files, $bytes bytes"
          if [ "$bytes" -lt 3000 ] || [ "$files" -lt 3 ]; then
            echo "::error::collection too small ($files files, $bytes bytes) — the sweep did not collect the real surface, so any 'no matches' below would be vacuous"
            exit 1
          fi
          echo "teeth check passed: the sweep collected a real surface"

          echo ""
          echo "=== every occurrence of 'confirm' in the collected surface ==="
          grep -io '.\{0,80\}confirm.\{0,80\}' "$OUT"/*.json | sort -u | head -60 \
            || echo "(no occurrence of 'confirm' anywhere)"

          echo ""
          echo "=== does ANY tool or action require a confirmation? ==="
          if grep -iE '"(requiresConfirm|confirmationRequired|require_confirm|needsConfirm|requires_confirmation)"[[:space:]]*:[[:space:]]*true' "$OUT"/*.json 2>/dev/null; then
            echo ">>> FOUND an action that requires confirmation"
            echo "FOUND=true" >> "$GITHUB_ENV"
          else
            echo ">>> no tool or action reports a true confirm requirement"
            echo "FOUND=false" >> "$GITHUB_ENV"
          fi

          echo ""
          echo "=== what the CLI's own keyword search returned ==="
          cat "$OUT/search_confirm.txt" 2>/dev/null | head -40

      - name: Does --confirm change what place says it will do?
        # Merely being tolerated is not a two-phase contract. A real one would
        # make the reply differ, so both replies are captured for comparison.
        run: |
          set -uo pipefail
          BGC="$TOOLCHAIN/node_modules/.bin/bgc"

          probe() {
            label="$1"; shift
            echo ""; echo "=== $label ==="; echo "\$ $*"
            set +e; "$@" 2>&1; echo "--- exit code: $?"; set -e
          }

          probe "place WITHOUT --confirm (dry run)" \
            "$BGC" order --action place --category SPOT --symbol BTCUSDT \
              --side sell --orderType market --qty 0.001 --paper-trading --dry-run

          probe "place WITH --confirm (dry run)" \
            "$BGC" order --action place --category SPOT --symbol BTCUSDT \
              --side sell --orderType market --qty 0.001 --paper-trading --dry-run --confirm

      - name: Summary
        if: always()
        run: |
          {
            echo "### CHECK_5 confirmation probe"
            echo
            echo "Question: what would be required to make the intended two-phase"
            echo "confirmation occur with the current Agent Hub CLI?"
            echo
            if [ "${FOUND:-unknown}" = "true" ]; then
              echo "**A confirm requirement was found on some tool or action.** See"
              echo "the search step — that is the routing target for CHECK_5."
            elif [ "${FOUND:-unknown}" = "false" ]; then
              echo "**No tool or action on the collected surface reports a true"
              echo "confirm requirement, and the CLI's own keyword search for"
              echo "'confirm' returns nothing.** With this CLI, \`--confirm\` is not"
              echo "a two-phase contract, so the confirm leg of Execution Guard"
              echo "CHECK 5 cannot be satisfied by a flag change. It would need a"
              echo "CLI version that implements one, or a different integration path."
            else
              echo "Probe did not reach a verdict — read the job log. A run that"
              echo "collected no surface deliberately fails rather than reporting"
              echo "'nothing found' over nothing."
            fi
            echo
            echo "- no Bitget credentials were present (checked before any CLI ran)"
            echo "- every order-shaped probe carried \`--dry-run\` and \`--paper-trading\`"
          } >> "$GITHUB_STEP_SUMMARY"
